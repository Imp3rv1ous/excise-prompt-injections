[project]
name = "excise"
version = "0.1.0"
description = "Locate and delete prompt injections in web pages before a browsing agent reads them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["excise*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.ruff]
line-length = 120
lint.select = ["E4", "E7", "E9", "F"]
extend-exclude = ["excise/agent/framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
